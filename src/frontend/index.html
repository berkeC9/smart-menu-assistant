<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Menu Assistant | AI-Powered Safe Dining</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" href="#">
        <span class="brand-icon"><i class="bi bi-shield-check"></i></span>
        <span>Smart Menu Assistant</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-lg-center gap-2">
          <li class="nav-item">
            <span class="nav-link active"><i class="bi bi-book-half me-1"></i> Menu</span>
          </li>
          <li class="nav-item">
            <span class="badge bg-success-subtle text-success border border-success-subtle px-3 py-2 rounded-pill">
              <i class="bi bi-shield-shaded me-1"></i> Allergen Guard Active
            </span>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero-section py-4 bg-light border-bottom">
    <div class="container">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="display-6 fw-bold text-dark mb-2">Safe, Personalized & Delicious Dining</h1>
          <p class="text-secondary mb-0">
            Exclude your food allergens, set your dietary preferences and calorie targets, and explore safe dishes instantly.
          </p>
        </div>
        <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
          <div class="d-inline-flex align-items-center gap-2 bg-white px-3 py-2 rounded-3 shadow-sm border">
            <i class="bi bi-stars text-primary fs-4"></i>
            <div class="text-start">
              <div class="small fw-bold">AI Menu Assistant</div>
              <div class="text-muted small">Ask questions via the chat widget</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container my-4">
  </main>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
